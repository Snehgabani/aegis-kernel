id: soc2-guard
name: SOC 2 Trust Services Criteria & System Invariant Guard
version: 1.0.0
description: Enforces access control and system integrity invariants for SOC 2 Type II compliance (CC6.1, CC6.6)

rules:
  - id: SOC2-001
    severity: critical
    description: Block system file path traversal and credential access (/etc/shadow, ~/.ssh, .env)
    condition:
      type: regex
      params:
        patterns:
          - SENSITIVE_FILE_PATH
        match_action: block

  - id: SOC2-002
    severity: critical
    description: Prohibit destructive schema DDL alterations and privilege escalations in production agent workflows
    condition:
      type: sql_ast
      params:
        block_statements:
          - DROP
          - TRUNCATE
          - ALTER
          - GRANT
          - REVOKE

  - id: SOC2-003
    severity: critical
    description: Block production database mass mutations lacking row-level WHERE constraints
    condition:
      type: sql_ast
      params:
        statements:
          - DELETE
          - UPDATE
        require: WHERE_CLAUSE

  - id: SOC2-004
    severity: critical
    description: Enforce multi-tenant data isolation and prevent cross-tenant parameter spoofing
    condition:
      type: state_invariant
      params:
        tenant_field: tenantId
        assertion: "state.tenantId != null"

  - id: SOC2-005
    severity: critical
    description: Prohibit order shipping or processing when order is cancelled
    condition:
      type: state_invariant
      params:
        target_field: order_id
        assertion: "state.order_status == null || state.order_status != 'cancelled'"

  - id: SOC2-006
    severity: critical
    description: Block destructive host commands (rm -rf, fork bombs, disk format)
    condition:
      type: regex
      params:
        patterns:
          - DESTRUCTIVE_COMMAND
        match_action: block

  - id: SOC2-007
    severity: critical
    description: Block zero-width invisible unicode characters in tool names and identifiers
    condition:
      type: regex
      params:
        field: tool_name
        patterns:
          - ZERO_WIDTH_TOOL
        match_action: block

