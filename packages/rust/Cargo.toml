[package]
name = "aegis-kernel"
version = "1.0.0"
edition = "2021"
description = "Deterministic Safety Invariant Kernel & Zero-Knowledge Attestation Crate for AI Agents"
authors = ["Sneh Gabani <sneh.gabani1999@gmail.com>"]

[dependencies]
regex = "1.10"
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0"
