[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-kernel"
version = "1.1.0"
description = "Aegis Invariant Kernel: Deterministic Tool-Call Safety Clearance Gateway for AI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Sneh Gabani", email = "sneh.gabani1999@gmail.com" }]
keywords = ["ai-safety", "agentic-ai", "langchain", "crewai", "autogen", "mcp", "security", "invariants"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://snehgabani.github.io/aegis-kernel/playground.html"
Documentation = "https://snehgabani.github.io/aegis-kernel/"
Repository = "https://github.com/Snehgabani/aegis-kernel"
Issues = "https://github.com/Snehgabani/aegis-kernel/issues"
Changelog = "https://github.com/Snehgabani/aegis-kernel/releases"
