version: '3.8'

services:
  aegis-gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: aegis-gateway
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - NODE_ENV=production
      - AEGIS_LICENSE_SECRET=aegis_enterprise_lic_verification_secret_v1_deterministic
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8787/health"]
      interval: 15s
      timeout: 3s
      retries: 3
