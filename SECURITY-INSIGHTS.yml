version: 1.0.0
project-lifecycle:
  status: active
  bug-bounty: https://github.com/Snehgabani/aegis-kernel/security/policy
  roadmap: https://github.com/Snehgabani/aegis-kernel/milestones
contribution-policy:
  accepts-contributions: true
  accepts-pull-requests: true
  code-of-conduct: https://github.com/Snehgabani/aegis-kernel/blob/main/CODE_OF_CONDUCT.md
  contributing: https://github.com/Snehgabani/aegis-kernel/blob/main/CONTRIBUTING.md
documentation:
  - https://snehgabani.github.io/aegis-kernel/
distribution-points:
  - https://github.com/Snehgabani/aegis-kernel/releases
security-assessments:
  - time: 2026-08-16
    type: automated-sast-and-secret-audit
    tool: CodeQL, Semgrep, Gitleaks, Hadolint, Anchore Grype, OSV-Scanner
    url: https://github.com/Snehgabani/aegis-kernel/actions
security-contacts:
  - type: url
    value: https://github.com/Snehgabani/aegis-kernel/security/advisories/new
dependencies:
  third-party:
    - name: vitest
      type: testing
    - name: node-sql-parser
      type: runtime
    - name: ajv
      type: validation
