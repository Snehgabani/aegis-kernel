version: 1.0.0
project-lifecycle:
  status: active
  bug-bounty: https://github.com/Snehgabani/aegis-kernel/security/policy
  roadmap: https://github.com/Snehgabani/aegis-kernel/milestones
contribution-policy:
  accepts-contributions: true
  accepts-pull-requests: true
  code-of-conduct: https://github.com/Snehgabani/aegis-kernel/blob/main/CODE_OF_CONDUCT.md
  contributing: https://github.com/Snehgabani/aegis-kernel/blob/main/CONTRIBUTING.md
documentation:
  - https://aegis-kernel.dev/docs
distribution-points:
  - https://www.npmjs.com/package/@aegis-kernel/core
  - https://pypi.org/project/aegis-kernel/
  - https://ghcr.io/snehgabani/aegis-gateway
security-assessments:
  - time: 2026-08-16
    type: automated-sast-and-secret-audit
    tool: CodeQL, Semgrep, Gitleaks, Hadolint, Anchore Grype
    url: https://github.com/Snehgabani/aegis-kernel/actions
security-contacts:
  - type: email
    value: security@aegis-kernel.dev
dependencies:
  third-party:
    - name: vitest
      type: testing
    - name: hono
      type: runtime
    - name: zed-industries/biscuit
      type: cryptography
