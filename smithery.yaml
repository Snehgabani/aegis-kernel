# Smithery configuration for Aegis Invariant Kernel MCP Gateway
# https://smithery.ai/docs/config

startCommand:
  type: stdio
  config:
    command: "npx"
    args:
      - "-y"
      - "@aegis-kernel/mcp"
      - "gateway"

tools:
  - name: aegis_scan_tool
    description: Deterministically scan and validate an MCP tool schema for prompt injection vectors and zero-width characters.
  - name: aegis_intercept_call
    description: Intercept and evaluate a tool call against discrete AST invariants (SQL, financial bounds, PII vault) in <0.25ms.
  - name: aegis_verify_proof
    description: Cryptographically verify an immutable SHA-256 Merkle audit proof for SOC 2 / ISO 42001 compliance.
