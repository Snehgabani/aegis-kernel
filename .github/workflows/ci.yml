name: Aegis CI/CD Verification & Quality Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  typescript-matrix:
    name: Node.js Matrix & Invariant Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build All Monorepo Packages
        run: npm run build

      - name: Typecheck & Lint All Packages
        run: npm run lint

      - name: Run Full Vitest Test Matrix (47 suites, 266+ tests)
        run: npm run test

      - name: Run Diagnostics Integrity Check
        run: node packages/cli/dist/index.js doctor

      - name: Execute End-to-End Live Verification Suite
        run: node scripts/live-e2e-proof.mjs

  python-matrix:
    name: Python SDK Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318edeed2796fe01b3c61a648ee # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python SDK Tests
        run: python -m unittest discover packages/python/tests
