name: Aegis CI/CD Verification & Quality Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  typescript-matrix:
    name: Node.js Matrix & Invariant Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build All Monorepo Packages
        run: npm run build

      - name: Typecheck & Lint All Packages
        run: npm run lint

      - name: Run Full Vitest Test Matrix (90 suites, 674 tests)
        run: npm run test

      - name: Run Diagnostics Integrity Check
        run: node packages/cli/dist/index.js doctor

      - name: Execute End-to-End Live Verification Suite
        run: node scripts/live-e2e-proof.mjs

  python-matrix:
    name: Python SDK Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python SDK Tests
        run: python -m unittest discover packages/python/tests
