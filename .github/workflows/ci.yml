name: Aegis CI/CD Verification & Quality Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript-matrix:
    name: Node.js Matrix & Invariant Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build All Monorepo Packages
        run: npm run build

      - name: Strict TypeScript Compilation Check
        run: npm run lint

      - name: Run Monorepo Test Matrix & 100-Vector Benchmark
        run: npm run test

      - name: Run E2E Proof (Subsystem Verification)
        run: node scripts/live-e2e-proof.mjs

      - name: Security Audit (npm audit)
        run: npm audit --audit-level=high || true
        continue-on-error: true

  python-matrix:
    name: Python Matrix (3.9 - 3.12)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python SDK Unit & Async Decorator Tests
        run: python -m unittest discover packages/python/tests
