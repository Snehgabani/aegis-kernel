name: GitHub Actions Cache Cleanup

on:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 3 AM UTC
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Purge Stale Action Caches
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Caches
        uses: actions/github-script@v9
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            console.log(`Found ${caches.data.total_count} total caches.`);
            for (const cache of caches.data.actions_caches) {
              const ageDays = (new Date() - new Date(cache.last_accessed_at)) / (1000 * 60 * 60 * 24);
              if (ageDays > 7) {
                console.log(`Deleting cache ${cache.key} (last accessed ${ageDays.toFixed(1)} days ago)`);
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
              }
            }
