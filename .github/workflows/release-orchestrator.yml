name: Polyglot Release Orchestrator

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Manage Release PR & GitHub Releases
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Run Google Release-Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  publish-packages:
    name: Publish Multi-Registry Release Artifacts
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install & Build Monorepo
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish to npm with Sigstore Provenance
        if: env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          for pkg in core cli mcp langchain openai anthropic vercel-ai diagnostics evals; do
            if [ -d "packages/$pkg" ]; then
              echo "Publishing @aegis-kernel/$pkg to npm..."
              (cd "packages/$pkg" && npm publish --access public --provenance) || echo "Package $pkg already published or skipped."
            fi
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build & Publish Python SDK to PyPI
        if: env.PYPI_API_TOKEN != ''
        run: |
          python -m pip install --upgrade build twine
          python -m build packages/python
          twine upload packages/python/dist/* --username __token__ --password ${{ secrets.PYPI_API_TOKEN }} --non-interactive || echo "PyPI release already exists or skipped."
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish Rust Crate to Crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          cargo publish --manifest-path packages/rust/Cargo.toml --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || echo "Rust crate already published or skipped."
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
