name: Dual SBOM Generation (SPDX & CycloneDX) & Vulnerability Audit

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 3 * * 2' # Weekly on Tuesday at 03:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  sbom-and-grype:
    name: Generate Software Bill of Materials & Audit CVEs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Generate SPDX JSON SBOM with Anchore Syft
        uses: anchore/sbom-action@v0
        with:
          path: '.'
          format: 'spdx-json'
          output-file: 'aegis-spdx-sbom.json'

      - name: Generate CycloneDX JSON SBOM with Anchore Syft
        uses: anchore/sbom-action@v0
        with:
          path: '.'
          format: 'cyclonedx-json'
          output-file: 'aegis-cyclonedx-sbom.json'

      - name: Scan SBOM with Anchore Grype
        uses: anchore/scan-action@v7
        with:
          sbom: 'aegis-spdx-sbom.json'
          fail-build: false
          severity-cutoff: 'critical'

      - name: Archive SBOM Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aegis-sboms
          path: |
            aegis-spdx-sbom.json
            aegis-cyclonedx-sbom.json
          retention-days: 90
