name: Dependency Review & Supply Chain Security Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: GitHub Dependency Review (CVE & Security Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Perform Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-1.0, GPL-2.0, GPL-3.0, SSPL-1.0
