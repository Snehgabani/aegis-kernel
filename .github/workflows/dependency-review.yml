name: Dependency Review & Supply Chain Security Gate

on:
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  dependency-review:
    name: GitHub Dependency Review (CVE & Security Audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Perform Dependency Review (Advisory Gate)
        uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          fail-on-severity: critical
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-1.0, GPL-2.0, GPL-3.0, SSPL-1.0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Monorepo Supply Chain Audit (npm audit)
        run: npm audit --audit-level=critical || true
