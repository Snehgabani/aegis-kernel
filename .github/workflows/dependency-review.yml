name: Dependency Review & Supply Chain Security Gate

on:
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  dependency-review:
    name: GitHub Dependency Review (CVE & Security Audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Perform Dependency Review (Advisory Gate)
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        continue-on-error: true
        with:
          fail-on-severity: critical
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-1.0, GPL-2.0, GPL-3.0, SSPL-1.0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x

      - name: Monorepo Supply Chain Audit (npm audit)
        run: npm audit --audit-level=critical || true
