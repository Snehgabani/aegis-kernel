name: Aegis Release Packaging & Distribution

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions: read-all

jobs:
  verify-and-pack:
    name: Verify & Package All Monorepo Distributions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python 3.11
        uses: actions/setup-python@0b93645e9fea7318edeed2796fe01b3c61a648ee # v5.3.0
        with:
          python-version: '3.11'

      - name: Install Monorepo Dependencies
        run: npm install --no-audit --no-fund

      - name: Build All Monorepo Packages
        run: npm run build

      - name: Run Full Test Matrix (136 Tests)
        run: npm run test

      - name: Run Python SDK Test Suite
        run: python -m unittest discover packages/python/tests

      - name: Validate Dry-Run npm Packaging on All 8 Packages
        run: |
          for dir in packages/* services/*; do
            if [ -f "$dir/package.json" ]; then
              echo "Packaging $dir..."
              (cd "$dir" && npm pack --dry-run) || exit 1
            fi
          done

      - name: Build Python Wheel & Tarball
        run: |
          python -m pip install --upgrade build
          python -m build packages/python

      - name: Generate Release Checksums
        run: |
          mkdir -p release-artifacts
          cp packages/python/dist/* release-artifacts/
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
          cat release-artifacts/SHA256SUMS.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: aegis-release-artifacts
          path: release-artifacts/
