name: Aegis Release Packaging & Distribution

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions: read-all

jobs:
  verify-and-pack:
    name: Verify & Package All Monorepo Distributions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Monorepo Dependencies
        run: npm install --no-audit --no-fund

      - name: Build All Monorepo Packages
        run: npm run build

      - name: Run Full Test Matrix (136 Tests)
        run: npm run test

      - name: Run Python SDK Test Suite
        run: python -m unittest discover packages/python/tests

      - name: Validate Dry-Run npm Packaging on All 8 Packages
        run: |
          for dir in packages/* services/*; do
            if [ -f "$dir/package.json" ]; then
              echo "Packaging $dir..."
              (cd "$dir" && npm pack --dry-run) || exit 1
            fi
          done

      - name: Build Python Wheel & Tarball
        run: |
          python -m pip install --upgrade build
          python -m build packages/python

      - name: Generate Release Checksums
        run: |
          mkdir -p release-artifacts
          cp packages/python/dist/* release-artifacts/
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
          cat release-artifacts/SHA256SUMS.txt

      - name: Publish to npm Registry (if NPM_TOKEN is provided)
        if: env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          for pkg in core cli mcp langchain openai anthropic diagnostics evals; do
            if [ -d "packages/$pkg" ]; then
              echo "Publishing @aegis-kernel/$pkg to npm..."
              (cd "packages/$pkg" && npm publish --access public) || echo "Failed to publish $pkg or already published"
            fi
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to PyPI (if PYPI_API_TOKEN is provided)
        if: env.PYPI_API_TOKEN != ''
        run: |
          python -m pip install --upgrade twine
          twine upload packages/python/dist/* --username __token__ --password ${{ secrets.PYPI_API_TOKEN }} --non-interactive || echo "PyPI upload failed or already exists"
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            packages/python/dist/*
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
