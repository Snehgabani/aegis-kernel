name: Automated Multi-Registry Release (npm & PyPI)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish-npm:
    name: Build & Publish to npm Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js (20.x)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build TypeScript Distributions
        run: npm run build

      - name: Execute Full Test Matrix
        run: npm test

      - name: Publish all 7 packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGES=(
            "packages/core"
            "packages/diagnostics"
            "packages/evals"
            "packages/mcp"
            "packages/cli"
            "packages/langchain"
            "packages/vercel-ai"
            "packages/openai"
            "packages/anthropic"
          )
          for PKG in "${PACKAGES[@]}"; do
            PKG_NAME=$(node -p "require('./$PKG/package.json').name")
            PKG_VER=$(node -p "require('./$PKG/package.json').version")
            echo "Checking $PKG_NAME@$PKG_VER on npm..."
            if [ "$(npm view "$PKG_NAME@$PKG_VER" version 2>/dev/null)" == "$PKG_VER" ]; then
              echo "  ⏩ $PKG_NAME@$PKG_VER is already published on npm, skipping."
            else
              echo "  📦 Publishing $PKG_NAME@$PKG_VER to npm with Sigstore provenance..."
              (cd "$PKG" && npm publish --access public --provenance)
            fi
          done

  publish-pypi:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Python (3.11)
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest

      - name: Run Python SDK Tests
        run: |
          PYTHONPATH=packages/python pytest packages/python/tests/
          PYTHONPATH=packages/crewai:packages/python pytest packages/crewai/tests/
          PYTHONPATH=packages/autogen:packages/python pytest packages/autogen/tests/
          PYTHONPATH=packages/browser-guard:packages/python pytest packages/browser-guard/tests/

      - name: Build & Publish All 4 Python Packages to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          PY_PKGS=("packages/python" "packages/crewai" "packages/autogen" "packages/browser-guard")
          for PKG in "${PY_PKGS[@]}"; do
            echo "📦 Building & Uploading $PKG to PyPI..."
            (
              cd "$PKG"
              rm -rf dist build
              python -m build
              twine upload --skip-existing --non-interactive dist/*
            )
          done
