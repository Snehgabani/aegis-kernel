name: Aegis Continuous Benchmark & Telemetry Scorecard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  benchmark:
    name: 10,000-Iteration Latency & Threat Matrix Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build All Monorepo Packages
        run: npm run build

      - name: Run Empirical Telemetry Benchmark
        run: node scripts/collect-verification-telemetry.mjs

      - name: Check Latency & Accuracy Invariants
        run: |
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(".aegis/benchmark-telemetry.json", "utf8"));
            console.log("Validating benchmark telemetry invariants...");
            
            if (data.latency.p95 > 2.0) {
              console.error(`❌ INVARIANT VIOLATION: P95 latency is ${data.latency.p95}ms (exceeds 2.0ms threshold)`);
              process.exit(1);
            }
            if (data.accuracy && data.accuracy.f1Score < 0.95) {
              console.error(`❌ INVARIANT VIOLATION: F1 score is ${(data.accuracy.f1Score*100).toFixed(1)}% (below 95% threshold)`);
              process.exit(1);
            }
            console.log("✅ All latency and accuracy invariants satisfied!");
          '
