name: Aegis Benchmark & Regression Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  benchmark:
    name: Statistical Benchmark + Baseline Regression Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build All Packages
        run: npm run build

      - name: Run Statistical Benchmark (profiles + percentiles + throughput)
        run: node packages/cli/dist/index.cjs benchmark --quick

      - name: Baseline Regression Gate (P50/P95 vs committed baseline)
        run: node packages/cli/dist/index.cjs benchmark --quick --compare

      - name: Upload Evidence Artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-evidence
          path: .benchmark/
          if-no-files-found: warn
