name: Pull Request Audit & Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  contents: read

jobs:
  pr-title-lint:
    name: Conventional Commits PR Title Check
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title Format
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  pr-test-suite:
    name: PR Monorepo Test & Benchmark Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Monorepo Workspaces
        run: npm run build

      - name: Run Test Suite
        run: npm run test

      - name: Run 100-Vector Benchmark
        run: node packages/cli/dist/index.js benchmark --tricky
