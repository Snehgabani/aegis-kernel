name: Bandit Python Static Security Analysis

on:
  push:
    paths:
      - 'packages/python/**'
      - '.github/workflows/bandit.yml'
  pull_request:
    paths:
      - 'packages/python/**'
  schedule:
    - cron: '0 5 * * 2' # Weekly on Tuesday at 05:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  bandit:
    name: PyCQA Bandit Python AST Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Security Scan on Python SDK
        run: bandit -r packages/python -ll
