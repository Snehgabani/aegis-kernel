name: Aegis Bot Autopilot & Automated CI Triage

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows:
      - "Aegis CI/CD Verification & Quality Matrix"
      - "Aegis Verification Pipeline"
      - "Aegis Code Coverage & Quality Gate"
      - "Go SDK Multi-Architecture Compilation & Verification"
      - "Rust Crate Matrix & Quality Assurance"
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: write
  statuses: write

concurrency:
  group: bot-autopilot-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  auto-triage-and-approve:
    name: Autonomous Bot Triage & Approval Gate
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Normalize PR Title (Conventional Commits Casing)
        if: github.event_name == 'pull_request_target'
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "Current PR title: $TITLE"
          
          # Match type(scope): Subject or type: Subject where Subject begins with Uppercase
          if [[ "$TITLE" =~ ^([a-z]+)(\([a-z0-9_-]+\))?:\ ([A-Z])(.*)$ ]]; then
            TYPE="${BASH_REMATCH[1]}"
            SCOPE="${BASH_REMATCH[2]}"
            FIRST_CHAR="${BASH_REMATCH[3]}"
            REST="${BASH_REMATCH[4]}"
            LOWER_CHAR=$(echo "$FIRST_CHAR" | tr '[:upper:]' '[:lower:]')
            NEW_TITLE="${TYPE}${SCOPE}: ${LOWER_CHAR}${REST}"
            echo "Auto-normalizing PR title to: $NEW_TITLE"
            gh pr edit "${{ github.event.pull_request.number }}" --title "$NEW_TITLE" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate Trusted Bot Authors
        id: bot-auth
        if: github.event_name == 'pull_request_target'
        run: |
          ACTOR="${{ github.event.pull_request.user.login }}"
          echo "Evaluating author: $ACTOR"
          if [[ "$ACTOR" == "github-actions[bot]" || "$ACTOR" == "app/github-actions" || "$ACTOR" == "arena-ai-coding-agent[bot]" || "$ACTOR" == "app/arena-ai-coding-agent" || "$ACTOR" == "dependabot[bot]" || "$ACTOR" == "app/dependabot" ]]; then
            echo "is_trusted_bot=true" >> $GITHUB_OUTPUT
          else
            echo "is_trusted_bot=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-Approve Trusted Bot PR
        if: github.event_name == 'pull_request_target' && steps.bot-auth.outputs.is_trusted_bot == 'true'
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          echo "Auto-approving PR #$PR_NUM from trusted bot..."
          gh pr review "$PR_NUM" --approve --body "🤖 [Aegis Bot Autopilot] Verified trusted bot payload. Pre-approved for auto-merge once all status checks pass." || true
          gh pr merge "$PR_NUM" --auto --squash --delete-branch || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
