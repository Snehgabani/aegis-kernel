name: Hadolint Container Image Dockerfile Linting

on:
  push:
    branches:
      - main
    paths:
      - '**/Dockerfile*'
      - '.github/workflows/hadolint.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/Dockerfile*'
  workflow_dispatch:

permissions: read-all

jobs:
  hadolint:
    name: Hadolint Best Practice & Security Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Gateway Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: 'services/gateway/Dockerfile'
          failure-threshold: error
          ignore: 'DL3018,DL3008,DL3059,DL3066'

      - name: Lint Root Production Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: 'Dockerfile'
          failure-threshold: error
          ignore: 'DL3018,DL3008,DL3059,DL3066'

      - name: Lint Benchmark Test Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: 'Dockerfile.test'
          failure-threshold: error
          ignore: 'DL3018,DL3008,DL3059,DL3066'
