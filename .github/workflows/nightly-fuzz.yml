name: Aegis Nightly Adversarial Fuzzing & Mutation Audit

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  adversarial-fuzz:
    name: Nightly Invariant Stress & Fuzz Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Monorepo
        run: npm run build

      - name: Execute 1,000-Iteration High-Concurrency Stress Test
        run: npx vitest run packages/core/__tests__/adversarial.test.ts

      - name: Execute 100-Vector Tricky Adversarial Testbed
        run: npx vitest run packages/evals/__tests__/tricky-100.test.ts

      - name: Run CLI Adversarial Benchmark
        run: node packages/cli/dist/index.js benchmark --tricky
