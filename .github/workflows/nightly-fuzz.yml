name: Nightly Adversarial Fuzzing & Continuous Benchmark

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  nightly-adversarial-run:
    name: Nightly 100-Vector Adversarial & Stress Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Packages
        run: npm run build

      - name: Run 100-Vector Tricky & Adversarial Testbed
        id: benchmark
        run: |
          node packages/cli/dist/index.js benchmark --tricky > benchmark_output.txt
          cat benchmark_output.txt

      - name: Check for Discrepancies
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Nightly Adversarial Benchmark Regression Alert',
              body: 'The nightly 100-vector adversarial stress test failed or detected discrepancies. Please review recent engine commits.',
              labels: ['security', 'automated-alert', 'bug']
            });
