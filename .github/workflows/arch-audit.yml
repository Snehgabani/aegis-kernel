name: Aegis Architectural Integrity & Boundary Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  arch-audit:
    name: Package Boundaries & Zero-Egress Core Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Verify Core Package Zero-Egress Invariant
        run: |
          echo "Auditing packages/core for unauthorized network dependencies..."
          
          # 1. Ensure core package dependencies contain ZERO networking/HTTP libraries
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("packages/core/package.json", "utf8"));
            const deps = Object.keys(pkg.dependencies || {});
            const forbidden = ["axios", "node-fetch", "got", "superagent", "undici", "request", "urllib", "ws", "socket.io", "http-proxy"];
            for (const d of deps) {
              if (forbidden.includes(d)) {
                console.error(`❌ Zero-Egress Violation: Forbidden network dependency "${d}" in packages/core/package.json`);
                process.exit(1);
              }
            }
            console.log("✅ Core dependencies verified clean: zero networking libraries.");
          '
          
          # 2. Ensure core evaluation hot-path has zero network primitives
          if grep -rnE "\b(fetch|http\.request|https\.request|net\.connect|dgram\.createSocket|WebSocket)\b" packages/core/src/checkers/ packages/core/src/engine.ts packages/core/src/sanitizer.ts packages/core/src/policy/ 2>/dev/null; then
            echo "❌ Violation: Raw network primitive found in packages/core evaluation hot-path"
            exit 1
          fi
          
          echo "✅ Core evaluation hot-path zero-egress architectural boundary verified!"

      - name: Audit Monorepo Package Imports
        run: |
          echo "Auditing internal monorepo cross-package boundaries..."
          node -e '
            const fs = require("fs");
            console.log("Checking package.json definitions across monorepo...");
            const pkgs = fs.readdirSync("packages");
            for (const pkg of pkgs) {
              const pkgJsonPath = `packages/${pkg}/package.json`;
              if (fs.existsSync(pkgJsonPath)) {
                const json = JSON.parse(fs.readFileSync(pkgJsonPath, "utf8"));
                console.log(`- ${json.name}: valid module structure (${json.type || "commonjs"})`);
              }
            }
          '
