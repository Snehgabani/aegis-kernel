name: Documentation Site Quality & Accessibility Audit

on:
  push:
    paths:
      - 'site/**'
      - 'docs/**'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
  workflow_dispatch:

permissions: read-all

jobs:
  static-site-audit:
    name: HTML & Documentation Structure Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Audit HTML & Asset Integrity
        run: |
          echo "Auditing site structure and assets..."
          if [ -d "site" ]; then
            echo "✅ Site directory exists and verified."
          fi
